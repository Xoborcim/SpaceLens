name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Most projects target net10.0-windows (WinUI / Windows APIs), so tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore SpaceLens.slnx
      - name: Test
        # The tests create fixture folders under %TEMP%. On hosted runners that is the 8.3 short path
        # C:\Users\RUNNER~1\AppData\Local\Temp, which the AppData/installed-content rules treat
        # differently from a normal dev machine, so use the runner's own temp directory instead.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test SpaceLens.slnx --no-restore --configuration Release
