name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    # Most projects target net10.0-windows (WinUI 3 / Windows APIs), so the solution builds and tests on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore SpaceLens.slnx
      - name: Test
        # The tests create fixture folders under %TEMP%. On hosted runners that is the 8.3 short path
        # C:\Users\RUNNER~1\AppData\Local\Temp, which the AppData/installed-content rules treat
        # differently from a normal dev machine, so use the runner's own temp directory instead.
        # The Avalonia UI tests drive the macOS app against a fake Mac home and run in the macOS job.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test SpaceLens.slnx --no-restore --configuration Release --filter "FullyQualifiedName!~SpaceLens.Avalonia.Tests"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test macOS layer
        run: dotnet test SpaceLens.Mac.Tests --configuration Release
      - name: Test Avalonia app
        run: dotnet test SpaceLens.Avalonia.Tests --configuration Release
